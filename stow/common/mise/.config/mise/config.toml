# Single cross-platform tool list for macOS (arm64) and Linux (x64).
# Runtimes and CLI tools are managed by mise on both machines; the lockfile
# next to this file carries the exact resolved versions.

[settings]
idiomatic_version_file_enable_tools = ["python"]
# Trust every mise.toml in cloned repos and T3 worktrees. An untrusted one
# breaks every shim (opencode included) in that repo, and trust is per path,
# so each new T3 worktree would need `mise trust` again.
trusted_config_paths = ["~/code", "~/Code", "~/.t3/worktrees"]
activate_aggressive = true
lockfile = true
# Installs read the lockfile but never rewrite it. Update it only with
# `mise lock -g -p linux-x64,macos-arm64`, so one machine cannot drop the
# other machine's entries.
locked = true

[tools]
# ─── Runtimes ───────────────────────────────────────────────────
node = "22"
ruby = "3"
erlang = "28.5.0.6"
elixir = "1.19.5-otp-28"
go = "latest"
python = "3.13"

# ─── CLI tools ──────────────────────────────────────────────────
ripgrep = "latest"
fd = "latest"
fzf = "latest"
eza = { version = "latest", os = ["linux"] }  # macOS: Homebrew (aqua package unsupported on darwin)
bat = "latest"
zoxide = "latest"
starship = "latest"
atuin = "latest"
delta = "latest"
lazygit = "latest"
dust = { version = "latest", os = ["linux"] }  # macOS: Homebrew (aqua package unsupported on darwin)
jq = "latest"
yq = "latest"
yazi = "latest"
gh = "latest"
direnv = "latest"
shellcheck = "latest"
shfmt = "latest"
gitleaks = "latest"
uv = "latest"
ruff = "latest"
btop = { version = "latest", os = ["linux"] }  # macOS: Homebrew (aqua package unsupported on darwin)
ast-grep = "latest"
# OpenCode: GitHub release binary (see [tool_alias] below). Upgrade: dots upgrade opencode
opencode = "latest"
lazydocker = "latest"

# sesh has no registry short name in this mise version.
"aqua:joshmedeski/sesh" = "latest"

# ─── npm ────────────────────────────────────────────────────────
"npm:pnpm" = "latest"
"npm:sfw" = "latest"
"npm:ccusage" = "latest"
"npm:pyright" = "latest"
"npm:defuddle" = "latest"

# ─── pipx ───────────────────────────────────────────────────────
"pipx:git-filter-repo" = "latest"

# ─── go ─────────────────────────────────────────────────────────
"go:golang.org/x/tools/gopls" = "latest"
"go:honnef.co/go/tools/cmd/staticcheck" = "latest"

[tool_alias]
# Pin the backend: the registry default for opencode is an npm package.
opencode = "aqua:anomalyco/opencode"
