[default_session]
startup_command = ""

[session_defaults]
preview_command = "eza --tree --level=2 --icons --color=always --git-ignore {}"

[[startup_session]]
name = "main"
path = "~"

# Lowercase "code" resolves on Linux and on case-insensitive macOS volumes.
[[startup_session]]
name = "dotfiles"
path = "~/code/personal/dotfiles"

[[startup_session]]
name = "notes"
path = "~/Notes"
